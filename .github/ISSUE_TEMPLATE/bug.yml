name: Bug 报告
description: 报告一个可以复现的 LinkForge 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。

        请勿提交 API Key、密码、Cookie、Token、登录状态、真实课程信息或其他隐私数据。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 清楚说明出现了什么问题。
      placeholder: 请描述你观察到的异常现象。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最小步骤。
      placeholder: |
        1. 执行……
        2. 打开……
        3. 选择……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？
    validations:
      required: true

  - type: input
    id: linkforge_version
    attributes:
      label: LinkForge 版本
      placeholder: 例如：0.1.0 或具体 Commit SHA
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python 版本
      placeholder: 例如：Python 3.12.5
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: 操作系统
      placeholder: 例如：Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 请先删除日志中的密钥、账号、Cookie和其他隐私信息。
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可以补充截图、页面状态或其他相关信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同问题。
          required: true
        - label: 我已经删除日志和截图中的敏感信息。
          required: true
        - label: 我提供的问题能够按照上述步骤复现。
          required: true