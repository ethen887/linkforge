name: LinkForge CI

# 什么时候触发
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# GitHub 权限
permissions:
  contents: read

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      # 下载代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 安装 uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 安装项目依赖
      - name: Install dependencies
        run: uv sync --locked

      # 安装 PySide6 / Qt 在 Linux CI 中需要的系统运行库
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      # 检查代码格式
      - name: Check formatting
        run: uv run ruff format --check .

      # 检查代码规范
      - name: Lint
        run: uv run ruff check .

      # 类型检查
      - name: Type check
        run: uv run mypy src

      # 安装 Browser 集成测试所需的 Chromium 和系统依赖
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # 自动化测试
      # GitHub Actions 没有真实显示器，因此 Qt 使用 offscreen 平台运行 GUI 单元测试
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest